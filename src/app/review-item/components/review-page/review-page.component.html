<div class="review-page standard-content-container-width" *ngIf="review$ | async as review; else loading">
  <app-breadcrumb [links]="breadcrumbLinks"></app-breadcrumb>
  <h1 class="review-page__title">Offene Review</h1>

  <ul class="review-page__slides">
    <li *ngFor="let slide of review.questions; trackBy: trackSlideById" class="review-page__slide">
      <header class="review-page__slide-header">
        <h2 *ngIf="slide.metadata?.title">{{ slide.metadata.title }}</h2>
        <p *ngIf="slide.metadata?.text">{{ slide.metadata.text }}</p>
      </header>

      <ul class="review-page__fields" *ngIf="slide.fields?.length">
        <li *ngFor="let field of slide.fields; trackBy: trackFieldById" class="review-page__field">
          {{ getFieldLabel(field) }}
        </li>
      </ul>
    </li>
  </ul>
</div>

<ng-template #loading>
  <p class="review-page__loading">Lade Review…</p>
</ng-template>
