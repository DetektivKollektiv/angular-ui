<div class="review-page" *ngIf="state$ | async as state; else loading">
  <ng-container *ngIf="state.review as review">
    <ng-container *ngIf="getVisibleQuestions(review) as visibleQuestions">
      <div class="review-page__breadcrumb container-width">
        <app-breadcrumb [links]="breadcrumbLinks"></app-breadcrumb>
      </div>

      <div class="review-page__layout container-width">
        <aside class="review-page__sidebar">
          <app-item-preview class="review-page__item-preview"></app-item-preview>
          <app-review-question-sidebar
            [questions]="visibleQuestions"
            [currentQuestionId]="state.currentQuestionId"
            [totalQuestions]="visibleQuestions.length"
            [currentPosition]="getQuestionPosition(review, state.currentQuestionId)"
            (questionSelected)="onQuestionSelected($event)"
          ></app-review-question-sidebar>
        </aside>

        <app-review-question-content
          class="review-page__content"
          *ngIf="getCurrentQuestion(state) as currentQuestion; else noSelection"
          [question]="currentQuestion"
          [position]="getQuestionPosition(review, currentQuestion.id)"
          [total]="visibleQuestions.length"
          (next)="onNextQuestion()"
          (answerChange)="onAnswerChange($event)"
        ></app-review-question-content>
      </div>
    </ng-container>
  </ng-container>
</div>

<ng-template #loading>
  <p class="review-page__loading">Lade Review…</p>
</ng-template>

<ng-template #noSelection>
  <div class="review-page__empty">Keine Frage ausgewählt.</div>
</ng-template>
