<button
  type="button"
  class="sidebar-question-button sidebar-question-button--{{ variant }}"
  [class.sidebar-question-button--active]="active"
  [ngClass]="indentClass"
  (click)="onClick()"
  [disabled]="disabled"
>
  <mat-icon
    *ngIf="question?.isAnswered"
    class="sidebar-question-button__icon"
    [class.sidebar-question-button__icon--active]="active || variant === 'mobile'"
    >check_circle</mat-icon
  >
  <svg
    *ngIf="!question?.isAnswered"
    class="sidebar-question-button__icon"
    [class.sidebar-question-button__icon--active]="active || variant === 'mobile'"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
    focusable="false"
  >
    <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="2" />
  </svg>
  <span class="sidebar-question-button__label">{{ question?.metadata?.title || 'Frage' }}</span>
</button>
