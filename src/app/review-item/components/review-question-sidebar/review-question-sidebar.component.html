<nav class="review-question-sidebar" *ngIf="questions?.length; else emptyState">
  <ul class="review-question-sidebar__list">
    <li
      *ngFor="let question of questions; trackBy: trackByQuestionId; let index = index"
      class="review-question-sidebar__item"
      [class.review-question-sidebar__button__indent_level--1]="question.metadata.indent_level === 1"
      [class.review-question-sidebar__button__indent_level--2]="question.metadata.indent_level === 2"
      [class.review-question-sidebar__button__indent_level--3]="question.metadata.indent_level === 3"
    >
      <button
        type="button"
        class="review-question-sidebar__button"
        [class.review-question-sidebar__button--active]="question.id === currentQuestionId"
        [class.review-question-sidebar__button--hoverable]="question.id !== currentQuestionId"
        (click)="onQuestionClick(question.id)"
      >
        <mat-icon
          *ngIf="question.isAnswered"
          class="review-question-sidebar__icon"
          [class.review-question-sidebar__icon--active]="question.id === currentQuestionId"
          >check_circle</mat-icon
        >
        <svg
          *ngIf="!question.isAnswered"
          class="review-question-sidebar__icon"
          [class.review-question-sidebar__icon--active]="question.id === currentQuestionId"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
        <span class="review-question-sidebar__label">
          {{ question.metadata?.title || 'Frage' }}
        </span>
      </button>
    </li>
  </ul>

  <div class="review-question-sidebar__progress" *ngIf="totalQuestions">
    <div class="review-question-sidebar__progress-bar">
      <div
        class="review-question-sidebar__progress-bar-fill"
        [style.width.%]="(currentPosition / totalQuestions) * 100"
      ></div>
    </div>
    <p class="review-question-sidebar__progress-text">{{ currentPosition }} / {{ totalQuestions }}</p>
  </div>
</nav>

<ng-template #emptyState>
  <div class="review-question-sidebar__empty">Keine Fragen vorhanden</div>
</ng-template>
