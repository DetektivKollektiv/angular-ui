<section class="traffic-light-field" [class.traffic-light-field--disabled]="field.is_disabled">
  <header *ngIf="showHeader" class="traffic-light-field__header">
    <span class="traffic-light-field__header-label">Bewertung</span>
    <ul class="traffic-light-field__legend">
      <li *ngFor="let light of lights; trackBy: trackLightByValue" class="traffic-light-field__legend-item">
        <div class="traffic-light-field__legend-icon">
          <svg viewBox="0 0 32 32" role="img" aria-hidden="true">
            <circle cx="16" cy="16" r="15" [attr.fill]="light.color"></circle>
          </svg>
          <mat-icon *ngIf="light.icon === 'help'" class="traffic-light-field__legend-mat-icon">question_mark</mat-icon>
          <mat-icon *ngIf="light.icon === 'remove'" class="traffic-light-field__legend-mat-icon">remove</mat-icon>
        </div>
      </li>
    </ul>
  </header>

  <div class="traffic-light-field__body">
    <p class="traffic-light-field__question">{{ question }}</p>
    <div class="traffic-light-field__options" role="radiogroup" [attr.aria-label]="question">
      <button
        *ngFor="let light of lights; trackBy: trackLightByValue"
        type="button"
        class="traffic-light-field__option"
        [class.traffic-light-field__option--selected]="isSelected(light.value)"
        [disabled]="field.is_disabled"
        (click)="select(light.value)"
        role="radio"
        [attr.aria-checked]="isSelected(light.value)"
      >
        <svg viewBox="0 0 40 40" class="traffic-light-field__option-svg" aria-hidden="true">
          <circle cx="20" cy="20" r="18" class="traffic-light-field__option-ring"></circle>
          <circle *ngIf="isSelected(light.value) && light.value !== 4" cx="20" cy="20" r="9" [attr.fill]="light.color"></circle>
          <line
            *ngIf="light.value === 4 && isSelected(light.value)"
            x1="14"
            y1="20"
            x2="26"
            y2="20"
            class="traffic-light-field__option-minus"
          ></line>
        </svg>
      </button>
    </div>
  </div>
</section>
