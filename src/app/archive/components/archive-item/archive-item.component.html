<article class="archive-card" [ngClass]="rating.colorClass">
  <div class="archive-card__image">
    <img *ngIf="imageUrl; else placeholder" [src]="imageUrl" [alt]="item.opengraph?.title || item.content" />
    <ng-template #placeholder>
      <div class="archive-card__placeholder">
        <span>{{ item.language?.toUpperCase() || 'N/A' }}</span>
      </div>
    </ng-template>
  </div>

  <div class="archive-card__content">
    <div class="archive-card__tags" *ngIf="item.content_tags?.length">
      <app-item-component
        *ngFor="let tag of item.content_tags; trackBy: trackByContentTag"
        [tag]="tag"
      ></app-item-component>
    </div>

    <h2 class="archive-card__title">{{ item.title }}</h2>
    <p class="archive-card__description">
      {{ item.opengraph?.description || item.content }}
    </p>

    <a [routerLink]="['/archive', item.id]" class="archive-card__cta">Fall ansehen</a>
  </div>

  <div class="archive-card__rating">
    <div class="archive-card__rating-header">
      <span>Bewertung</span>
      <app-action-link theme="dark"></app-action-link>
    </div>
    <div class="archive-card__badge" [ngClass]="rating.badgeClass">
      {{ rating.label }}
    </div>

    <div class="archive-card__rating-tags">
      <div class="archive-card__rating-tags-title">Tags zur Bewertung</div>
      <div class="archive-card__rating-tags-list" *ngIf="item.review_tags?.length">
        <span
          class="archive-card__rating-tag"
          [ngClass]="getReviewTagClass(tag)"
          *ngFor="let tag of getPreviewTags(); trackBy: trackByReviewTag; let last = last"
        >
          {{ tag.text }}<span *ngIf="!last">,</span>
        </span>
      </div>
      <div class="archive-card__rating-no-tags" *ngIf="!item.review_tags?.length">Keine Tags verfügbar</div>
    </div>
  </div>
</article>
