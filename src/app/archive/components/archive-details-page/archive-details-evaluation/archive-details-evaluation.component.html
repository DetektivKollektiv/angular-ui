<section class="evaluation" *ngIf="item">
  <header class="evaluation__header">
    <div>
      <h2 class="evaluation__title">Fallbearbeitung</h2>
      <p class="evaluation__subtitle">So wurde der Fall nach den fünf Trust-Checking-Kriterien im Detail bewertet</p>
    </div>
    <app-action-link text="Hilfe" icon="support" theme="dark"></app-action-link>
  </header>

  <div class="evaluation__categories">
    <div
      class="evaluation__category"
      *ngFor="let category of item.rating_categories; trackBy: trackCategory"
      [class.evaluation__category--expanded]="isExpanded(category.category_id)"
    >
      <button class="evaluation__category-header" type="button" (click)="toggleCategory(category.category_id)">
        <div class="evaluation__category-left">
          <mat-icon>{{ category.icon }}</mat-icon>
          <span class="evaluation__category-title">{{ category.title }}</span>
        </div>
        <span class="evaluation__category-toggle">
          {{ isExpanded(category.category_id) ? 'Ausblenden' : 'Anzeigen' }}
          <mat-icon>{{ isExpanded(category.category_id) ? 'expand_less' : 'expand_more' }}</mat-icon>
        </span>
      </button>

      <div class="evaluation__category-content" *ngIf="isExpanded(category.category_id)">
        <div class="evaluation__slider">
          <swiper
            #categorySwiper
            class="evaluation__swiper"
            [spaceBetween]="swiperSpacing"
            [slidesPerView]="1"
            [breakpoints]="swiperBreakpoints"
            (swiper)="handleSwiperInit(category.category_id, $event)"
            (slideChange)="handleSlideChange(category.category_id, categorySwiper?.swiperRef)"
          >
            <ng-template swiperSlide *ngFor="let question of category.questions; trackBy: trackQuestion">
              <article class="evaluation__card">
                <div class="evaluation__card-section">
                  <p class="evaluation__card-label">Frage</p>
                  <p class="evaluation__card-text">{{ question.question_text }}</p>
                </div>

                <div class="evaluation__divider" role="separator"></div>

                <div class="evaluation__card-section">
                  <p class="evaluation__card-label">Hinweis</p>
                  <span class="evaluation__tag" [ngStyle]="getTagStyle(question.rating_tag.score)">
                    {{ question.rating_tag.text }}
                  </span>
                </div>

                <div class="evaluation__divider" role="separator"></div>

                <div class="evaluation__card-section">
                  <p class="evaluation__card-label">Einschätzung</p>
                  <div class="evaluation__distribution">
                    <div class="evaluation__distribution-row" *ngFor="let entry of getDistributionEntries(question.distribution)">
                      <div class="evaluation__distribution-bar">
                        <div class="evaluation__distribution-fill" [style.width.%]="entry.percent" [style.background]="entry.color"></div>
                      </div>
                      <span class="evaluation__distribution-value">{{ entry.percent }}%</span>
                    </div>
                  </div>
                </div>
              </article>
            </ng-template>
          </swiper>
        </div>
        <button
          class="evaluation__nav evaluation__nav--prev"
          type="button"
          (click)="slidePrev(categorySwiper)"
          [disabled]="isBeginning(category.category_id)"
        >
          <mat-icon>chevron_left</mat-icon>
        </button>

        <button
          class="evaluation__nav evaluation__nav--next"
          type="button"
          (click)="slideNext(categorySwiper)"
          [disabled]="isEnd(category.category_id)"
        >
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </div>
  </div>
</section>
