<section class="details-top" *ngIf="item">
  <div class="details-top__left">
    <p class="details-top__eyebrow">Infos zum Fall</p>
    <h1 class="details-top__title">{{ title }}</h1>
    <p class="details-top__description">{{ description }}</p>
  </div>

  <div class="details-top__right">
    <div class="details-top__actions">
      <app-action-link text="Fall melden" icon="flag" theme="dark" [url]="null" iconColor="#FF7268"></app-action-link>
      <app-action-link text="Hilfe" icon="support" theme="dark"></app-action-link>
      <app-action-link text="Fall bearbeiten" icon="edit_document" theme="dark" [url]="null" iconColor="#140735"></app-action-link>
    </div>

    <div class="details-top__image" *ngIf="imageUrl">
      <img [src]="imageUrl" [alt]="title" />
    </div>

    <div class="details-top__tags" *ngIf="item.content_tags?.length">
      <p class="details-top__tags-title">Tags zum Inhalt</p>
      <div class="details-top__tags-list">
        <app-item-component *ngFor="let tag of item.content_tags; trackBy: trackByTag" [tag]="tag"></app-item-component>
      </div>
    </div>

    <div class="details-top__link" *ngIf="link">
      <p class="details-top__link-title">Hinterlegter Link:</p>
      <a class="details-top__link-url" [href]="link" target="_blank" rel="noopener">{{ link }}</a>
    </div>
  </div>
</section>
