<div class="archive-details-page">
  <div class="container-width" *ngIf="detailItem$ | async as item">
    <div class="breadcrumb">
      <app-breadcrumb [links]="breadcrumbLinks"></app-breadcrumb>
    </div>
    <div class="back-button">
      <button appButton routerLink="/archive">Zurück zur Übersicht</button>
    </div>
    <app-archive-details-top [item]="item"></app-archive-details-top>
    <app-archive-details-rating [item]="item"></app-archive-details-rating>
    <app-archive-details-evaluation [item]="item"></app-archive-details-evaluation>
    <app-archive-details-comments [comments]="item.comments"></app-archive-details-comments>
    <div *ngIf="loading">Lade Fall …</div>
  </div>
</div>
